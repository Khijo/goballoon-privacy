<style>
:root{--bg:#f3f9fe;--card:#ffffff;--text:#1b2733;--muted:#4a5a68;--accent:#0b67a3;--sky:#8fd3ff;--line:#d5e6f3;
--code:#eaf4fb;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,
"Helvetica Neue",Arial,sans-serif}
.sky{height:10px;background:linear-gradient(90deg,#8fd3ff,#bfe7ff,#8fd3ff)}
main{max-width:720px;margin:0 auto;padding:24px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 22px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:var(--text);text-decoration:none}
.brand svg{width:34px;height:34px}
a{color:var(--accent);overflow-wrap:anywhere}
a:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:3px}
.lang{font-weight:600;padding:6px 12px;border:2px solid var(--accent);border-radius:999px;text-decoration:none}
h1{font-size:28px;line-height:1.25;margin:0 0 6px}
h2{font-size:21px;line-height:1.3;margin:34px 0 10px;padding-top:10px;border-top:2px solid var(--line)}
.updated{color:var(--muted);margin:0 0 20px}
nav.toc{background:var(--code);border-radius:10px;padding:12px 18px;margin:0 0 8px}
nav.toc h2{border:0;margin:0 0 6px;padding:0;font-size:17px}
nav.toc ol{margin:0;padding-left:22px}
nav.toc li{margin:2px 0}
ul{padding-left:22px}
li{margin:6px 0}
code{background:var(--code);border-radius:5px;padding:1px 5px;font-size:15px;
font-family:ui-monospace,Consolas,"Liberation Mono",monospace;overflow-wrap:anywhere}
.table{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.5}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--code)}
footer{max-width:720px;margin:0 auto;padding:0 16px 32px;color:var(--muted);font-size:15px;text-align:center}
.chooser{text-align:center}
.chooser svg{width:72px;height:72px}
.chooser p{margin:6px 0 18px;color:var(--muted)}
.buttons{display:flex;flex-direction:column;gap:12px;max-width:320px;margin:0 auto}
.buttons a{display:block;padding:14px 18px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;
font-size:19px;text-decoration:none}
.buttons a:focus-visible{outline-color:#1b2733}
.chooser p.terms{margin:22px 0 0}
@media (max-width:480px){.card{padding:18px 14px}h1{font-size:24px}h2{font-size:19px}}
@media (max-width:600px){.table{overflow:visible}table,tbody,tr,td{display:block;width:100%}
thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
tr{border:1px solid var(--line);border-radius:10px;margin:0 0 12px;overflow:hidden}
td{border:0;border-top:1px solid var(--line)}td:first-child{border-top:0;background:var(--code);font-weight:600}
td::before{content:attr(data-label);display:block;font-size:13px;font-weight:700;color:var(--muted);
text-transform:uppercase;letter-spacing:.03em}}
</style>
